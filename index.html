<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;font-size:22px;line-height:1.7;color:#12274a;background:linear-gradient(120deg,#e3f0ff,#fff3d6,#e3f0ff,#dff7ee);background-size:400% 400%;animation:bg 16s ease infinite;overflow-x:hidden}

.f{position:fixed;bottom:-60px;font:bold 30px monospace;color:rgba(13,74,138,.13);animation:up linear infinite;pointer-events:none;z-index:0}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg)}}
header{position:relative;z-index:1;text-align:center;padding:14px}header img{width:130px;height:130px;animation:pop 3s ease-in-out infinite}
@keyframes pop{50%{transform:scale(1.07)}}
h1{margin:4px 0;color:#0d4a8a;font-size:34px}h1 small{display:block;font-size:24px;color:#e08a00}
main{position:relative;z-index:1;max-width:1150px;margin:auto;padding:8px 12px 60px}
.card{background:#fff;border-radius:24px;padding:20px;margin:22px 0;box-shadow:0 8px 24px rgba(13,74,138,.18);border-top:8px solid #f0a30f}
.card>h2{margin:0 0 12px;color:#fff;background:linear-gradient(90deg,#0d4a8a,#3a78c9);padding:10px 18px;border-radius:16px;font-size:28px;text-align:center}
.bi{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:850px){.bi{grid-template-columns:1fr}}
.en{direction:ltr;text-align:left;background:#f1f7ff;border-radius:16px;padding:14px;border-left:6px solid #0d4a8a}
.ar{direction:rtl;text-align:right;background:#fff8e8;border-radius:16px;padding:14px;border-right:6px solid #f0a30f}
b{color:#c2410c}.ex{background:#fff;border:2px dashed #0d4a8a;border-radius:14px;padding:10px 14px;margin:8px 0;font-weight:bold}
table{border-collapse:collapse;width:100%;background:#fff}td,th{border:2px solid #0d4a8a;padding:6px 10px;text-align:center}th{background:#0d4a8a;color:#fff}
.btns{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:16px}
button{font:inherit;font-weight:bold;cursor:pointer;border:0;border-radius:16px;padding:12px 24px;color:#fff;background:linear-gradient(#ffb92e,#e08a00);box-shadow:0 5px 0 #a86100;transition:.15s}button:hover{transform:translateY(-2px)}button:active{transform:translateY(3px);box-shadow:0 2px 0 #a86100}
button.b2{background:linear-gradient(#3a78c9,#0d4a8a);box-shadow:0 5px 0 #08305a}button.b3{background:linear-gradient(#2fb67a,#12875a);box-shadow:0 5px 0 #0a5b3c}
.w{background:#eefbea;border:3px solid #2fb67a;border-radius:18px;padding:14px;margin:10px 0;text-align:center;direction:ltr}
.bits{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.bt{width:70px;padding:8px 0;background:#cbd5e1;box-shadow:0 4px 0 #64748b;color:#12274a}.bt.on{background:linear-gradient(#ffb92e,#e08a00);box-shadow:0 4px 0 #a86100;color:#fff}.bt small{display:block;font-size:14px}
.w input{font:inherit;width:140px;padding:8px;border-radius:12px;border:3px solid #0d4a8a;text-align:center}
.exam{background:linear-gradient(135deg,#0d4a8a,#3a78c9);color:#fff;text-align:center}.exam h2{background:#f0a30f}.exam p{margin:6px}
#qz,#nm{position:fixed;inset:0;z-index:50;background:rgba(10,30,70,.88);overflow:auto;padding:10px}
.qb{max-width:950px;margin:10px auto;background:#fff;border-radius:26px;padding:22px;border-top:10px solid #f0a30f;min-height:60vh}
.qh{display:flex;justify-content:space-between;align-items:center;color:#0d4a8a;font-weight:bold;font-size:24px}.qh button{padding:6px 14px;background:#dc2626;box-shadow:0 4px 0 #8d1111}
.bar{height:16px;background:#e2e8f0;border-radius:9px;margin:10px 0;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2fb67a,#ffb92e);transition:.4s}
#qs{font-size:22px;color:#64748b}#qq{font-size:32px;font-weight:bold;margin:14px 0;color:#12274a}
.op{display:block;width:100%;margin:10px 0;text-align:inherit;font-size:28px;color:#12274a;background:#eef4ff;border:3px solid #3a78c9;box-shadow:0 5px 0 #9db9e3}.op span{display:inline-block;min-width:44px;height:44px;line-height:44px;text-align:center;border-radius:50%;background:#0d4a8a;color:#fff;margin-inline-end:10px}
.op.ok{background:#bbf7d0!important;border-color:#16a34a;animation:ok .6s}.op.no{background:#fecaca!important;border-color:#dc2626;animation:sh .5s}
@keyframes ok{50%{transform:scale(1.04)}}@keyframes sh{20%,60%{transform:translateX(-14px)}40%,80%{transform:translateX(14px)}}
#qf{font-size:28px;font-weight:bold;margin:12px 0}#qf.g{color:#16a34a}#qf.r{color:#dc2626}
.em{position:fixed;top:-70px;font-size:44px;z-index:99;pointer-events:none;animation:fall 1.8s ease-in forwards}@keyframes fall{to{transform:translateY(115vh) rotate(380deg)}}
.fl2{position:fixed;inset:0;z-index:98;pointer-events:none;animation:fo .7s forwards}.fl2.g{background:rgba(34,197,94,.35)}.fl2.r{background:rgba(239,68,68,.35)}@keyframes fo{to{opacity:0}}
.nmb{max-width:560px;margin:12vh auto;background:#fff;border-radius:24px;padding:26px;text-align:center}.nmb input{font:inherit;width:100%;padding:12px;border:3px solid #0d4a8a;border-radius:14px;text-align:center;margin:12px 0}
.res{text-align:center}.res .big{font-size:80px}.res h3{font-size:40px;margin:6px;color:#0d4a8a}

const P=[
["1 Bit — البت",
`<p>A <b>bit</b> is the <b>smallest unit of information</b>. It has only two possible states: <b>"0"</b> and <b>"1"</b>.</p><p>One bit can represent two states, such as: a switch is <b>on or off</b>; voltage is <b>high or low</b>; orientation of a magnet is <b>north or south</b>.</p><p>Actual information is represented by the <b>arrangement of bits</b>. In general, <b>n bits</b> can represent <b>2ⁿ</b> different pieces of information.</p><div class=ex>1 bit: 2 possibilities: 0 or 1<br>2 bits: 4 possibilities: 00, 01, 10, 11<br>3 bits: 8 possibilities: 000, 001, 010, 011, 100, 101, 110, 111</div>`,
`<p><b>البت (bit)</b> هو <b>أصغر وحدة</b> لقياس البيانات والمعلومات داخل الكمبيوتر، وله حالتان فقط: <b>"0"</b> و <b>"1"</b>.</p><p>أمثلة على حالتي البت: المفتاح الكهربي <b>مفتوح أو مغلق</b>، الجهد الكهربي <b>مرتفع أو منخفض</b>، اتجاه المغناطيس <b>شمال أو جنوب</b>.</p><p>الكمبيوتر لا يفهم الحروف والصور مباشرة، بل يخزن كل البيانات على شكل أصفار وآحاد، ويتم تمثيل البيانات الفعلية بترتيب الـ bits. بشكل عام: يمكن لـ <b>n bit</b> تمثيل <b>2ⁿ</b> احتمال.</p><div class=ex>1 Bit ⇐ احتمالان: 0 أو 1<br>2 Bits ⇐ 4 احتمالات: 00, 01, 10, 11<br>3 Bits ⇐ 8 احتمالات: 000, 001, 010, 011, 100, 101, 110, 111</div>`],
["2 Byte — البايت",
`<p>A <b>byte</b> is a unit consisting of <b>8 bits</b>. The notation is <b>B</b>.</p><div class=ex>1 B = 8 bits → can represent 256 possibilities (2⁸ = 256), from 0 to 255.</div><p>Remember: <b>8 bits = 1 byte</b>.</p>`,
`<p><b>البايت (Byte)</b>: وحدة تتكون من <b>8 bit</b>، ويرمز إليها بالرمز <b>B</b>. أي أن كل بايت يحتوي على ثمانية أصفار وآحاد.</p><div class=ex>1 Byte = 8 bit ← يمثل 256 احتمالًا (2⁸ = 256)، أي القيم من 0 إلى 255.</div><p>تذكّر: <b>8 Bits = 1 Byte</b>.</p>`],
["3 Units of Information — وحدات قياس البيانات",
`<p>The basic unit is <b>1 B</b>. The unit increases every <b>2¹⁰ = 1,024</b> times.</p><table><tr><th>Unit</th><th>Equals</th></tr><tr><td>1 KB</td><td>1,024 B</td></tr><tr><td>1 MB</td><td>1,024 KB</td></tr><tr><td>1 GB</td><td>1,024 MB</td></tr><tr><td>1 TB</td><td>1,024 GB</td></tr></table><p>Order: Byte → KB → MB → GB → TB (each is bigger).</p>`,
`<p>الوحدة الأساسية هي <b>1B</b>، وتتغير الوحدة كل <b>1,024</b> مرة.</p><table><tr><th>الوحدة</th><th>تساوي</th></tr><tr><td>1 KB (كيلوبايت)</td><td>1024 B</td></tr><tr><td>1 MB (ميجابايت)</td><td>1024 KB</td></tr><tr><td>1 GB (جيجابايت)</td><td>1024 MB</td></tr><tr><td>1 TB (تيرابايت)</td><td>1024 GB</td></tr></table><p>الترتيب: Byte → KB → MB → GB → TB، وكل وحدة أكبر تساوي 1024 من الوحدة الأصغر.</p>`],
["4 Decimal and Binary — النظام العشري والثنائي",
`<p><b>Decimal</b>: a method of representing numbers using <b>ten digits</b> from "0" to "9" (we use it every day).</p><p><b>Binary</b>: a method of representing numbers using <b>two digits</b>, "0" and "1". A binary number is sometimes written with a <b>subscript (2)</b>.</p><div class=ex>Decimal: 15, 28, 100, 365<br>Binary: 0₂, 1₂, 10₂, 101₂, 111₂</div><p>Computers use binary because their electronic parts have only two states: current (1) or no current (0).</p>`,

function snd(ok){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ok)[523,659,784,1047].forEach((f,k)=>tone(f,.18,'triangle',k*.1));else[240,180,130].forEach((f,k)=>tone(f,.28,'sawtooth',k*.18))}catch(e){}}
function fx(ok){snd(ok);const f=document.createElement('div');f.className='fl2 '+(ok?'g':'r');document.body.append(f);setTimeout(()=>f.remove(),800);const E=ok?['🎉','⭐','✨','🎊','😀','👏']:['😢','💔','😞','❌'];for(let k=0;k<(ok?28:10);k++){const s=document.createElement('span');s.className='em';s.textContent=E[k%E.length];s.style.left=Math.random()*95+'vw';s.style.animationDelay=Math.random()*.6+'s';document.body.append(s);setTimeout(()=>s.remove(),2600)}if(!ok){const q=$('.qb');q.style.animation='none';q.offsetWidth;q.style.animation='sh .5s'}}
</script></body></html>
